<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Putar Titik P</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: satu kartu. Atas: lingkaran satuan dengan titik P. Tengah: penggeser dan tombol cepat. Bawah: aturan kuadran dan tabel tanda sin, cos, tan. */
:root {
  --bg: #FFFFFF; --surface-2: #F4F6FC; --ink: #14183A; --muted: #4F597E; --line: #D5DBEF;
  --accent: #2F41CC; --accent-soft: #E3E8FF; --on-accent: #FFFFFF; --yellow: #F5B800;
  --warm: #B35F00; --pos: #0F7A5A; --pos-soft: #DAF3EA; --neg: #B83224; --neg-soft: #FCE4E0;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #0F1330; --surface-2: #1A2150; --ink: #EDF0FF; --muted: #A6AFD6; --line: #2B3465; --accent: #93A1FF; --accent-soft: #252E63; --on-accent: #0F1330; --warm: #F5A94A; --pos: #4CD2AE; --pos-soft: #12392F; --neg: #FF8A7A; --neg-soft: #432027; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #0F1330; --surface-2: #1A2150; --ink: #EDF0FF; --muted: #A6AFD6; --line: #2B3465; --accent: #93A1FF; --accent-soft: #252E63; --on-accent: #0F1330; --warm: #F5A94A; --pos: #4CD2AE; --pos-soft: #12392F; --neg: #FF8A7A; --neg-soft: #432027; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 400 17px/1.55 var(--font); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 28px; }
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
h1 { font-size: 24px; line-height: 1.2; margin: 0; text-wrap: balance; }
p { margin: 0; }
.hint { color: var(--muted); font-size: 16px; }
:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
svg { width: 100%; height: auto; display: block; background: var(--surface-2); border-radius: 14px; }
svg text { font-family: var(--font); fill: var(--ink); }
.axis { stroke: var(--ink); stroke-width: 2; }
.circ { fill: none; stroke: var(--muted); stroke-width: 1.5; }
.qn { font-size: 26px; font-weight: 700; fill: var(--muted); opacity: .55; }
.lbl { font-size: 15px; font-weight: 700; }
.ctrl { display: flex; align-items: center; gap: 12px; }
.ctrl label { font: 600 15px var(--font); min-width: 64px; }
.ctrl input { flex: 1; min-width: 0; height: 36px; accent-color: var(--accent); }
.ctrl .val { font: 700 18px var(--mono); min-width: 52px; text-align: right; }
.jump { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.jump button { border: 1.5px solid var(--accent); background: transparent; color: var(--accent); border-radius: 12px; padding: 10px 4px; font: 700 15px var(--font); cursor: pointer; line-height: 1.2; }
.jump button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.jump small { display: block; font-weight: 500; font-size: 12px; }
.rule { background: var(--accent-soft); border-radius: 12px; padding: 12px 14px; font-weight: 600; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 15px; color: var(--muted); }
.legend i { display: inline-block; width: 22px; height: 6px; border-radius: 3px; vertical-align: middle; margin-right: 6px; }
table { width: 100%; border-collapse: collapse; font-size: 17px; }
th, td { padding: 10px 8px; text-align: left; border-bottom: 1px solid var(--line); }
th { font-size: 14px; color: var(--muted); font-weight: 600; }
td.f { font-weight: 700; }
td.v { font-family: var(--mono); font-size: 15px; }
.sg { display: inline-block; min-width: 34px; text-align: center; padding: 2px 8px; border-radius: 999px; font: 700 17px var(--mono); }
.sg.p { background: var(--pos-soft); color: var(--pos); }
.sg.n { background: var(--neg-soft); color: var(--neg); }
.sg.z { background: var(--surface-2); color: var(--muted); }
.note { color: var(--muted); font-size: 15px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <h1>Putar Titik P</h1>
  <p class="hint">Geser penggeser atau seret titik kuning. Perhatikan tanda sin, cos, dan tan di tiap kuadran.</p>

  <svg id="svg" viewBox="0 0 320 320" role="img" aria-label="Lingkaran satuan dengan titik P yang bisa diputar">
    <rect id="qr" rx="0"/>
    <circle class="circ" cx="160" cy="160" r="110"/>
    <line class="axis" x1="18" y1="160" x2="302" y2="160"/>
    <line class="axis" x1="160" y1="18" x2="160" y2="302"/>
    <text class="qn" x="302" y="48" text-anchor="end">I</text><text class="qn" x="18" y="48">II</text><text class="qn" x="18" y="306">III</text><text class="qn" x="302" y="306" text-anchor="end">IV</text>
    <text class="lbl" x="298" y="148" text-anchor="end">x</text><text class="lbl" x="168" y="30">y</text>
    <line id="rad" stroke="var(--ink)" stroke-width="2"/>
    <line id="cosl" stroke="var(--warm)" stroke-width="6" stroke-linecap="round"/>
    <line id="sinl" stroke="var(--accent)" stroke-width="6" stroke-linecap="round"/>
    <path id="arc" fill="none" stroke="var(--ink)" stroke-width="1.5"/>
    <text id="th" class="lbl" font-style="italic">θ</text>
    <circle id="pt" r="9" fill="var(--yellow)" stroke="var(--ink)" stroke-width="2.5"/>
    <text id="pl" class="lbl">P</text>
    <circle id="hp" r="26" fill="transparent" style="cursor:grab;touch-action:none"/>
  </svg>

  <div class="legend"><span><i style="background:var(--warm)"></i>x = cos θ</span><span><i style="background:var(--accent)"></i>y = sin θ</span></div>

  <div class="ctrl"><label for="ang">Sudut θ</label><input id="ang" type="range" min="0" max="360" step="15" value="150"><span class="val" id="angv"></span></div>
  <div class="jump" role="group" aria-label="Lompat ke kuadran">
    <button type="button" data-a="30">Kuadran I<small>30°</small></button>
    <button type="button" data-a="150">Kuadran II<small>150°</small></button>
    <button type="button" data-a="210">Kuadran III<small>210°</small></button>
    <button type="button" data-a="330">Kuadran IV<small>330°</small></button>
  </div>

  <div class="rule" id="rule" role="status" aria-live="polite"></div>

  <table aria-label="Tanda dan nilai perbandingan trigonometri">
    <thead><tr><th>Fungsi</th><th>Tanda</th><th>Nilai</th></tr></thead>
    <tbody id="tb"></tbody>
  </table>
  <p class="note">Tanda csc sama dengan sin, sec sama dengan cos, dan cot sama dengan tan.</p>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var C = 160, R = 110;
  var SIN = ['0', '1/2', '½√2', '½√3', '1'], COS = ['1', '½√3', '½√2', '1/2', '0'], TAN = ['0', '⅓√3', '1', '√3', null], REF = [0, 30, 45, 60, 90];
  var RULES = [
    'Titik berada tepat di sumbu, bukan di salah satu kuadran.',
    'Kuadran I: semua perbandingan positif.',
    'Kuadran II: hanya sin (dan csc) yang positif.',
    'Kuadran III: hanya tan (dan cot) yang positif.',
    'Kuadran IV: hanya cos (dan sec) yang positif.'
  ];
  var QBOX = { 1: [160, 18], 2: [18, 18], 3: [18, 160], 4: [160, 160] };
  function fmt(x) { if (Math.abs(x) < 1e-9) x = 0; return x.toLocaleString('id-ID', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function quad(d) { if (d % 90 === 0) return 0; return d < 90 ? 1 : d < 180 ? 2 : d < 270 ? 3 : 4; }
  function refAngle(d) { var r = d % 360; if (r <= 90) return r; if (r <= 180) return 180 - r; if (r <= 270) return r - 180; return 360 - r; }
  function sign(v) { return Math.abs(v) < 1e-9 ? 'z' : v > 0 ? 'p' : 'n'; }
  function symb(v) { return Math.abs(v) < 1e-9 ? '0' : v > 0 ? '+' : '−'; }
  function set(el, o) { for (var k in o) el.setAttribute(k, o[k]); }
  function row(name, v, exacts, d) {
    if (v === null) return '<tr><td class="f">' + name + '</td><td><span class="sg z">—</span></td><td class="v">tak terdefinisi</td></tr>';
    var i = REF.indexOf(refAngle(d)), ex = i > -1 ? exacts[i] : null, s = sign(v), txt;
    if (ex && s !== 'z') txt = (s === 'n' ? '−' : '') + ex + ' ≈ ' + fmt(v); else txt = fmt(v);
    return '<tr><td class="f">' + name + '</td><td><span class="sg ' + s + '">' + symb(v) + '</span></td><td class="v">' + txt + '</td></tr>';
  }
  function draw() {
    var d = +$('ang').value, t = d * Math.PI / 180, x = Math.cos(t), y = Math.sin(t);
    var px = C + R * x, py = C - R * y, q = quad(d);
    var r = $('qr');
    if (q) { set(r, { x: QBOX[q][0], y: QBOX[q][1], width: 142, height: 142, fill: 'var(--accent-soft)' }); } else { set(r, { width: 0, height: 0 }); }
    set($('rad'), { x1: C, y1: C, x2: px, y2: py });
    set($('cosl'), { x1: C, y1: C, x2: px, y2: C });
    set($('sinl'), { x1: px, y1: C, x2: px, y2: py });
    var ar = 30;
    $('arc').setAttribute('d', d > 0 && d < 360 ? 'M' + (C + ar) + ' ' + C + ' A' + ar + ' ' + ar + ' 0 ' + (d > 180 ? 1 : 0) + ' 0 ' + (C + ar * Math.cos(t)) + ' ' + (C - ar * Math.sin(t)) : '');
    var mid = t / 2;
    set($('th'), { x: C + 46 * Math.cos(mid) - 5, y: C - 46 * Math.sin(mid) + 5 });
    set($('pt'), { cx: px, cy: py }); set($('hp'), { cx: px, cy: py });
    var lx = px + (x >= 0 ? 14 : -14), ly = py + (y >= 0 ? -12 : 20);
    set($('pl'), { x: lx, y: ly, 'text-anchor': x >= 0 ? 'start' : 'end' }); $('pl').textContent = 'P';
    $('angv').textContent = d + '°';
    $('rule').textContent = RULES[q];
    var tanV = Math.abs(x) < 1e-9 ? null : y / x;
    $('tb').innerHTML = row('sin θ', y, SIN, d) + row('cos θ', x, COS, d) + row('tan θ', tanV, TAN, d);
    Array.prototype.forEach.call(document.querySelectorAll('.jump button'), function (b) { b.setAttribute('aria-pressed', String(+b.dataset.a === d)); });
  }
  $('ang').addEventListener('input', draw);
  Array.prototype.forEach.call(document.querySelectorAll('.jump button'), function (b) { b.addEventListener('click', function () { $('ang').value = b.dataset.a; draw(); }); });
  var drag = false, hp = $('hp'), svg = $('svg');
  function fromPointer(e) {
    var b = svg.getBoundingClientRect(), x = (e.clientX - b.left) / b.width * 320 - C, y = C - (e.clientY - b.top) / b.height * 320;
    var d = Math.round(((Math.atan2(y, x) * 180 / Math.PI + 360) % 360) / 15) * 15;
    $('ang').value = d % 360 === 0 && +$('ang').value >= 180 ? 360 : d % 360; draw();
  }
  hp.addEventListener('pointerdown', function (e) { drag = true; try { hp.setPointerCapture(e.pointerId); } catch (x) {} e.preventDefault(); });
  hp.addEventListener('pointermove', function (e) { if (drag) fromPointer(e); });
  hp.addEventListener('pointerup', function () { drag = false; });
  hp.addEventListener('pointercancel', function () { drag = false; });
  draw();
})();
</script>

</body></html>
